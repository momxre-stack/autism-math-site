<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>რიცხვების სამყარო • Number World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="home-top">
        <div class="home-star">⭐</div>
        <h1 class="home-title">რიცხვების სამყარო</h1>
        <p class="home-sub">Number World</p>
        <div class="lang-row">
          <button class="lang-btn active" onclick="setLang('ka')">🇬🇪 ქართული</button>
          <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
        </div>
      </div>
      <div class="chapters-grid">
        <button class="ch-btn" onclick="startChapter(1)">
          <span class="ch-num">1</span>
          <span class="ch-name" data-ka="ერთი" data-en="One">ერთი</span>
          <span class="ch-progress" id="prog-1">0/13</span>
        </button>
        <button class="ch-btn locked">
          <span class="ch-num">2</span>
          <span class="ch-name" data-ka="ორი" data-en="Two">ორი</span>
          <span class="ch-lock">🔒</span>
        </button>
        <button class="ch-btn locked">
          <span class="ch-num">3</span>
          <span class="ch-name" data-ka="სამი" data-en="Three">სამი</span>
          <span class="ch-lock">🔒</span>
        </button>
        <button class="ch-btn locked">
          <span class="ch-num">4</span>
          <span class="ch-name" data-ka="ოთხი" data-en="Four">ოთხი</span>
          <span class="ch-lock">🔒</span>
        </button>
        <button class="ch-btn locked">
          <span class="ch-num">5</span>
          <span class="ch-name" data-ka="ხუთი" data-en="Five">ხუთი</span>
          <span class="ch-lock">🔒</span>
        </button>
        <button class="ch-btn locked">
          <span class="ch-num">9</span>
          <span class="ch-name" data-ka="ცხრა" data-en="Nine">ცხრა</span>
          <span class="ch-lock">🔒</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CHAPTER 1 -->
  <div id="screen-ch1" class="screen">
    <div class="lesson-header" style="background:var(--orange)">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="hdr-center">
        <span class="hdr-label" data-ka="შევისწავლოთ რიცხვი" data-en="Let's learn number">შევისწავლოთ რიცხვი</span>
        <span class="hdr-num">1</span>
      </div>
      <div class="hdr-stars" id="hdr-stars">☆☆☆</div>
    </div>

    <div class="tasks-wrap" id="tasks-wrap">
      <!-- tasks injected by JS -->
    </div>

    <!-- WIN OVERLAY -->
    <div id="win-overlay" class="win-overlay hidden">
      <div class="win-box">
        <div class="win-stars">⭐⭐⭐</div>
        <div class="win-big">🎉</div>
        <h2 class="win-title" data-ka="ბრავო! გაიმარჯვე!" data-en="Amazing! You won!">ბრავო! გაიმარჯვე!</h2>
        <p class="win-sub" data-ka="რიცხვი 1 ისწავლე!" data-en="You learned number 1!">რიცხვი 1 ისწავლე!</p>
        <button class="big-btn" onclick="goHome()">🏠 <span data-ka="მთავარი" data-en="Home">მთავარი</span></button>
      </div>
    </div>
  </div>

  <script src="tasks.js"></script>
  <script src="app.js"></script>
</body>
</html>
